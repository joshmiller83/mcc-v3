$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Site Footer
group: MCC Components
props:
  type: object
  properties:
    logo_icon_src:
      type: string
      title: Footer logo icon path
    wordmark_lines:
      type: array
      title: Wordmark lines in the brand chip
      items:
        type: string
    tagline:
      type: string
      title: Italic tagline under the brand chip
    newsletter_heading:
      type: string
      title: Newsletter row heading
    newsletter_description:
      type: string
      title: Newsletter row supporting line
    columns:
      type: array
      title: Footer link columns (Visit / Ministries / Connect / About)
      items:
        type: object
        properties:
          heading:
            type: string
          links:
            type: array
            items:
              type: object
              properties:
                label:
                  type: string
                url:
                  type: string
                is_link:
                  type: boolean
    credit_line:
      type: string
      title: Legal row, left
    contact_line:
      type: string
      title: Legal row, right (address and phone)
slots:
  newsletter_form:
    title: Signup form
    description: The real newsletter webform block, rendered by the caller.

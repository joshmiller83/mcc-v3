mcc_core.calendar:
  path: '/calendar'
  defaults:
    _controller: '\Drupal\mcc_core\Controller\MccCalendarController::view'
    _title: 'Calendar'
  requirements:
    _permission: 'access content'

mcc_core.print_monthly:
  path: '/calendar/print'
  defaults:
    _controller: '\Drupal\mcc_core\Controller\MccCalendarPrintController::view'
    _title: 'Printable calendar'
  requirements:
    _permission: 'access content'

mcc_core.calendar_settings:
  path: '/admin/config/content/mcc-calendar'
  defaults:
    _form: '\Drupal\mcc_core\Form\CalendarSettingsForm'
    _title: 'Calendar'
  requirements:
    _permission: 'administer site configuration'

services:
  logger.channel.mcc_migration:
    parent: logger.channel_base
    arguments: ['mcc_migration']

  mcc_migration.manualcrop_to_focal_point:
    class: Drupal\mcc_migration\ManualCropToFocalPoint
    arguments:
      - '@database'
      - '@entity_type.manager'
      - '@file_system'
      - '@focal_point.manager'
      - '@logger.channel.mcc_migration'

  mcc_migration.focal_point_subscriber:
    class: Drupal\mcc_migration\EventSubscriber\FocalPointMigrateSubscriber
    arguments:
      - '@mcc_migration.manualcrop_to_focal_point'
    tags:
      - { name: event_subscriber }

  mcc_migration.bio_duplicate_merger:
    class: Drupal\mcc_migration\BioDuplicateMerger
    arguments:
      - '@entity_type.manager'
      - '@path_alias.manager'
      - '@datetime.time'
      - '@logger.channel.mcc_migration'

  mcc_migration.bio_merge_subscriber:
    class: Drupal\mcc_migration\EventSubscriber\BioMergeMigrateSubscriber
    arguments:
      - '@mcc_migration.bio_duplicate_merger'
    tags:
      - { name: event_subscriber }

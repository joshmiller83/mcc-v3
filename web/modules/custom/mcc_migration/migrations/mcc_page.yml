id: mcc_page
label: 'MCC Basic Pages'
migration_group: mcc
migration_dependencies:
  required:
    - mcc_user
    - mcc_media_image
    - mcc_media_document
    - mcc_taxonomy
source:
  plugin: d7_node
  node_type: page
process:
  # D7 nids 8 (Youth), 11 (Worship Service) and 1099 (Youth) are type `page` in
  # the source but functioned as ministries — D7's main menu had node/8 "Youth"
  # as a top-level item and its sidebar had node/11 "Worship Service" as a
  # section head. mcc_calendar_event also does a migration_lookup against
  # mcc_ministry for them, which used to create ministry stubs at those nids and
  # made this migration fail with a duplicate-primary-key error.
  #
  # 8 and 11 are imported as ministries by mcc_ministry_page instead. 1099 is an
  # empty duplicate of 8 (NULL body in D7) and is dropped entirely.
  #
  # The rest are pages the new IA supersedes. They are skipped rather than
  # imported-then-unpublished so that a re-import is deterministic — otherwise
  # every re-run would republish them, because status comes from the D7 source.
  # Their content is still in the `legacy` database if it is ever wanted.
  #
  #    1  D7 body was "Hello World."; the real front page is Canvas page 9
  #    2  content belongs to the /im-new Canvas page
  #   14  Adult Classes      — NULL body in D7, a placeholder never filled in
  #   15  Childrens Classes  — NULL body in D7, ditto
  #   16  Teens Classes      — NULL body in D7, ditto
  #   29  superseded by the /ministries Canvas landing page
  #   41  superseded by ministry node 40 at /ministries/missions
  #  189  a page node duplicating bio content
  #  344  test fixture
  nid:
    plugin: skip_on_value
    source: nid
    method: row
    value:
      - 1
      - 2
      - 8
      - 11
      - 14
      - 15
      - 16
      - 29
      - 41
      - 189
      - 344
      - 1099
  title: title
  uid: node_uid
  status: status
  moderation_state:
    plugin: static_map
    source: status
    map:
      1: published
      0: draft
    default_value: draft
  created: created
  changed: changed
  promote: promote
  sticky: sticky

  # The page bundle has no body field — Drupal CMS gives it field_content. The
  # old `body: body` mapping resolved to NULL and was skipped without an error
  # (EntityContentBase::updateEntity only assigns when the value is a
  # TypedDataInterface), so every page imported with an empty body.
  # d7_node exposes Field API values delta-indexed, hence body/0/…; none of the
  # 21 source pages use a summary, which field_content (text_long) has no room
  # for anyway.
  field_content/value: body/0/value
  field_content/format:
    plugin: static_map
    source: body/0/format
    map:
      filtered_html: content_format
      # The 20 pages marked "full html" are Apple/Word pastes, not hand-written
      # HTML — inline `font-family: Helvetica`, `Times New Roman`, and
      # `Apple-style-span` wrappers. Same call as mcc_bio: nothing in them needs
      # more than the standard format allows.
      full_html: content_format
    # Anything unrecognised lands in the restrictive format rather than
    # granting full HTML to unreviewed legacy markup.
    default_value: content_format
  field_featured_image:
    plugin: migration_lookup
    migration: mcc_media_image
    source: field_featured_image/fid
  field_attachments:
    plugin: migration_lookup
    migration: mcc_media_document
    source: field_attachments/fid
  field_bio_reference:
    plugin: migration_lookup
    migration: mcc_bio
    source: field_bio_reference/target_id
  field_tags:
    plugin: migration_lookup
    migration: mcc_taxonomy
    source: field_tags/tid
destination:
  plugin: 'entity:node'
  default_bundle: page

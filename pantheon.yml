api_version: 1

# Override the Drupal CMS upstream's default (8.3) to match local ddev (8.4.22),
# since composer.lock resolves packages (e.g. symfony/css-selector) that require PHP >=8.4.1.
php_version: 8.4

# Bring every environment's database up to date with the code that just landed, without a
# manual drush step: the hook runs `drush deploy` (updatedb, config:import, deploy:hook,
# cache:rebuild, in that order). sync_code fires after a git push builds and deploys (dev
# today); deploy fires on a dev->test or test->live promotion.
workflows:
  sync_code:
    after:
      - type: webphp
        description: Deploy (updatedb, config import, cache rebuild) after code sync
        script: private/scripts/quicksilver/config-import.php
  deploy:
    after:
      - type: webphp
        description: Deploy (updatedb, config import, cache rebuild) after environment promotion
        script: private/scripts/quicksilver/config-import.php

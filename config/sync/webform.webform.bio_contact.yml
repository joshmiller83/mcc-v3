id: bio_contact
title: 'Message a member of the leadership'
description: 'Shown in the "Get in touch" section of every bio page. One form serves all of them; the person being written to is passed in as hidden data, so the office knows who the message is for. This is what the site publishes instead of personal phone numbers and email addresses.'

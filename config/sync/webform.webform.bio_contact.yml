  person:
    '#type': hidden
    '#title': 'Bio node ID'
  person_name:
    '#type': hidden
    '#title': 'Who this message is for'
  name:
    '#type': textfield
    '#title': 'Your name'
    '#required': true
    '#placeholder': 'Jane Doe'
  reply_to:
    '#type': textfield
    '#title': 'Email or phone'
    '#required': true
    '#placeholder': 'How should we reach you?'
    '#description': 'However you would like us to get back to you.'
  message:
    '#type': textarea
    '#title': Message
    '#required': true
    '#rows': 4
    '#placeholder': 'Tell us a little about what you need.'
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
    '#submit__label': 'Send message'

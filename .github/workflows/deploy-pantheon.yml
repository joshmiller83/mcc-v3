name: Deploy to Pantheon

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    # The push trigger is already main-only; this guards workflow_dispatch,
    # which can be launched from any ref and would otherwise deploy it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Pantheon deploy key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.PANTHEON_SSH_PRIVATE_KEY }}" > ~/.ssh/pantheon_deploy_key
          chmod 600 ~/.ssh/pantheon_deploy_key
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          ssh-add ~/.ssh/pantheon_deploy_key
          cat >> ~/.ssh/config <<'EOF'
          Host *.drush.in
            StrictHostKeyChecking accept-new
            Port 2222
          EOF
          chmod 600 ~/.ssh/config

      # This only pushes source (composer.json/lock, code) — no vendor/ or
      # web/core, matching .gitignore. Pantheon's Integrated Composer build
      # step (build_step: true in pantheon.upstream.yml) runs `composer
      # install` server-side and deploys the result to the dev environment.
      - name: Push to Pantheon (mcc2026, dev environment)
        run: |
          git remote add pantheon ssh://codeserver.dev.3e7034de-9912-4c4f-8856-5492a6770559@codeserver.dev.3e7034de-9912-4c4f-8856-5492a6770559.drush.in:2222/~/repository.git
          max_attempts=3
          attempt=1
          while [ "$attempt" -le "$max_attempts" ]; do
            if git push pantheon HEAD:master; then
              exit 0
            fi
            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep_seconds=$((attempt * 10))
              echo "Pantheon push failed (attempt $attempt/$max_attempts). Retrying in ${sleep_seconds}s..."
              sleep "$sleep_seconds"
            fi
            attempt=$((attempt + 1))
          done
          echo "Pantheon push failed after $max_attempts attempts."
          exit 1

      - name: Clean up deploy key
        if: always()
        run: |
          rm -f ~/.ssh/pantheon_deploy_key
          ssh-agent -k || true
